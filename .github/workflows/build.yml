name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get -y install liblua5.2-dev

      - name: Build and install cont
        run: |
          git clone --depth=1 --branch=master https://github.com/izuzanak/cont.git ${GITHUB_WORKSPACE}/../cont

          cd ${GITHUB_WORKSPACE}/../cont/build
          cmake ..
          make
          sudo make install

      - name: Build yapgen
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake ..
          make -j"$(nproc)"
          sudo make install

      - name: Test yapgen
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ./test.sh > test.out

